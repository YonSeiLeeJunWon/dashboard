name: Daily Insurance News & Dashboard Update

on:
  schedule:
    # 매일 한국 시간(KST) 오전 9시 (UTC 00:00) 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 깃허브 웹에서 'Run workflow' 버튼으로 수동 실행 가능

# Git Push 권한 부여
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl beautifulsoup4 requests numpy

    - name: Run Automation Script
      env:
        NAVER_COOKIE: ${{ secrets.NAVER_COOKIE }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python auto_github_action.py

    - name: Commit and Push Updated Files
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 데이터 엑셀 및 대시보드 HTML 변경사항 등록
        git add DATA/IN/보험뉴스_Data.xlsx DATA/OUT/보험회사_종합분석_대시보드.html index.html
        
        # 변경사항이 있을 때만 커밋 및 푸시
        if ! git diff --staged --quiet; then
          git commit -m "Auto update: Insurance News & Dashboard [$(date +'%Y-%m-%d')]"
          git push
        else
          echo "No changes detected."
        fi
